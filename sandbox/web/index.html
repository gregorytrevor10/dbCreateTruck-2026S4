<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRUCK · Fleet Operations</title>
<link rel="stylesheet" href="/vendor/codemirror.css">
<link rel="stylesheet" href="/vendor/show-hint.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark">T</span>
      <span class="brand-name">TRUCK</span>
      <span class="brand-sub">Fleet Operations</span>
    </div>
    <div class="topbar-right">
      <span id="today" class="today"></span>
      <span class="conn"><span class="dot" id="status-dot"></span><span id="status-text">connecting</span></span>
      <button id="reseed" class="btn">Reseed</button>
    </div>
  </header>

  <aside class="rail">
    <nav id="nav"></nav>
    <div class="rail-foot">
      <h2>tables</h2>
      <input id="filter" class="filter" type="search" placeholder="Filter" autocomplete="off">
      <ul id="list-tables" class="objects"></ul>
    </div>
  </aside>

  <main id="view" class="view"></main>

  <footer class="statusbar">
    <span id="status-left">ready</span>
    <span class="spacer"></span>
    <span id="timing" class="mono"></span>
  </footer>

</div>

<script src="/vendor/codemirror.js"></script>
<script src="/vendor/sql.js"></script>
<script src="/vendor/matchbrackets.js"></script>
<script src="/vendor/show-hint.js"></script>
<script src="/vendor/sql-hint.js"></script>
<script src="/app.js"></script>
</body>
</html>
